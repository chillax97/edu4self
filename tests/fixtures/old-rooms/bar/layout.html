<!-- The bar: two columns. Left the sign, the job and its replies, then the talk; right the jukebox (the one
     timer, its record turns while a block runs), tonight, the week, the chalk board, the die and the music.
     The finish line, locked tasks and trophies are in the back room (THEMES.md, the front-room budget). -->
<div class="bx">
  <section class="bx-mid">
    <div data-slot="name"></div>
    <div data-slot="rooms"></div>
    <div data-slot="job"></div>
    <ol class="bx-replies" data-slot="replies"></ol>
    <div class="bx-log" data-slot="voices"></div>
    <p class="bx-keys" data-slot="keys"></p>
  </section>
  <aside class="bx-right">
    <div class="bx-juke">
      <div class="bx-vinyl" data-part="running" aria-hidden="true"></div>
      <div class="bx-k bx-juke-k">The jukebox · focus block</div>
      <div data-slot="block"></div>
    </div>
    <div class="bx-stats"><div data-slot="tonight"></div><div data-slot="week"></div></div>
    <div class="bx-board" data-slot="streak"></div>
    <div class="bx-cab" data-slot="die"></div>
    <div data-slot="music"></div>
  </aside>
</div>
