name: CI

on:
  push:
    branches: [main, windows]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    name: unit · ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor because it is macOS's system Python; GitHub's Ubuntu images no longer carry it
        include:
          - { os: ubuntu-latest, python: "3.10" }
          - { os: ubuntu-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: A fresh vault passes its own check
        env:
          EDU4SELF_CONFIG_HOME: ${{ runner.temp }}/cfg
        run: |
          python edu4self init "$RUNNER_TEMP/vault" --name CI
          python edu4self check
          python edu4self init "$RUNNER_TEMP/empty" --no-example
          python edu4self check --vault "$RUNNER_TEMP/empty"

  unit-windows:
    name: unit (Windows) · Python ${{ matrix.python }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: A fresh vault passes its own check
        shell: bash
        env:
          EDU4SELF_CONFIG_HOME: ${{ runner.temp }}/cfg
        run: |
          python edu4self init "$RUNNER_TEMP/vault" --name CI
          python edu4self check
          python edu4self init "$RUNNER_TEMP/empty" --no-example
          python edu4self check --vault "$RUNNER_TEMP/empty"

  unit-macos:
    name: unit (mac) · ${{ matrix.os }} · Python ${{ matrix.python }}
    # macOS runners are slow: release tags and manual runs only (day to day, the Mac check is a local run)
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # 3.9 is the floor because it is macOS's system Python; GitHub's Ubuntu images no longer carry it
        include:
          - { os: macos-latest, python: "3.9" }
          - { os: macos-latest, python: "3.13" }
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (standard library only)
        run: python -m unittest discover -s tests -v
      - name: A fresh vault passes its own check
        env:
          EDU4SELF_CONFIG_HOME: ${{ runner.temp }}/cfg
        run: |
          python edu4self init "$RUNNER_TEMP/vault" --name CI
          python edu4self check
          python edu4self init "$RUNNER_TEMP/empty" --no-example
          python edu4self check --vault "$RUNNER_TEMP/empty"

  browser:
    name: browser tests (Chrome)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - name: Run against a throwaway vault
        working-directory: tests/e2e
        run: CHROME_PATH="$(command -v google-chrome || command -v google-chrome-stable)" npm test

  browser-windows:
    name: browser tests (Chrome, Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: tests/e2e/package-lock.json
      - run: npm ci
        working-directory: tests/e2e
      - name: Run against a throwaway vault
        working-directory: tests/e2e
        run: npm test

  plugin:
    name: Claude Code plugin manifests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate ./plugin
      - run: claude plugin validate .
