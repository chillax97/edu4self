<!-- Tea house: paper screens and a low table. The scroll (your job) hangs in the middle, the guests
     speak beside it, the kettle and the tins sit on the shelf. Light, calm, one thing at a time. -->
<div class="te">
  <header class="te-head">
    <div data-slot="name"></div>
    <div data-slot="rooms"></div>
    <span class="te-noren" data-slot="sign"></span>
    <span class="te-time" data-slot="clock"></span>
  </header>
  <div class="te-shelf">
    <div class="te-cup" data-slot="tonight"></div>
    <div class="te-cup" data-slot="week"></div>
    <div class="te-cup bx-cab" data-slot="die"></div>
  </div>
  <div class="te-room">
    <section class="te-scroll">
      <div class="te-rod" aria-hidden="true"></div>
      <div data-slot="timer"></div>
      <div data-slot="job"></div>
      <ol class="bx-replies" data-slot="replies"></ol>
      <p class="bx-keys" data-slot="keys"></p>
      <div class="te-rod" aria-hidden="true"></div>
    </section>
    <section class="te-guests">
      <div class="bx-log" data-slot="voices"></div>
      <div class="te-tray" data-slot="water"></div>
    </section>
    <aside class="te-side">
      <div class="bx-juke"><p class="te-k">The kettle · focus block</p><div data-slot="block"></div></div>
      <div data-slot="music"></div>
      <div class="te-note" data-slot="finish"></div>
      <div class="te-note" data-slot="doors"></div>
    </aside>
  </div>
</div>
